<!doctype html>
<html class="no-js" lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wann Nächster erster Dienstag?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#003399',
            secondary: '#6b7280',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            headline: ['Lubalin Graph', 'sans-serif'] // Custom headline font
          },
          boxShadow: {
            card: '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
          },
        }
      }
    }
  </script>
  <style>
    @font-face {
      font-family: 'Lubalin Graph';
      src: url('fonts/LubalinGraph.woff2') format('woff2'),
      url('fonts/LubalinGraph.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Zeigt den nächsten Dienstag nach dem ersten Montag des Monats an">

  <meta property="og:title" content="Termin-Helfer">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#003399">
</head>

<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-4 sm:px-6 py-8 max-w-6xl">

  <main>
    <section class="mb-10 sm:mb-16">
      <div class="bg-white rounded-xl shadow-card overflow-hidden transform transition-all hover:shadow-card-hover">
        <div class="bg-gradient-to-r from-primary to-indigo-700 p-5 sm:p-6 text-white text-center">
          <h1 class="text-3xl sm:text-4xl font-headline my-3 tracking-tight">
            Nächster erster Dienstag nach dem ersten Montag
          </h1>
        </div>
        <div class="p-6 sm:p-8 text-center">
          <div id="next-tuesday-date" class="text-5xl font-bold my-8 text-red">Wird berechnet...</div>
          <div id="next-tuesday-info" class="text-gray-600"></div>
        </div>
        <div class="bg-gray-50 p-4 border-t border-gray-100 flex justify-between items-center text-sm">
          <p class="text-gray-600">Aktuelles Datum: <span id="current-date" class="font-medium"></span></p>
        </div>
      </div>
    </section>

    <section>
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-4 sm:mb-0">
          Kommende erste Dienstage <span id="current-year"></span>
        </h2>
        <button id="toggle-year-view"
                class="self-start sm:self-auto px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
          Alle Termine anzeigen
        </button>
      </div>

      <div id="upcoming-dates" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
      </div>
    </section>

    <section class="mt-10 sm:mt-12">
      <div id="year-overview" class="hidden">
        <div class="bg-white rounded-xl shadow-card overflow-hidden">
          <div class="overflow-x-auto">
            <table id="year-dates" class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-100">
              <tr>
                <th scope="col"
                    class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Monat
                </th>
                <th scope="col"
                    class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Termin
                </th>
              </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="mt-10 sm:mt-12 mb-10 sm:mb-16">
      <div class="p-5 sm:p-6 text-center">
        <figure class="relative">
          <img src="img/meme.webp" alt="Terminfindungs-Meme"
               class="mx-auto rounded-lg max-w-full h-auto max-h-96 object-contain">
        </figure>
      </div>
    </section>
  </main>

  <footer class="mt-12 sm:mt-16 pt-6 sm:pt-8 border-t border-gray-200 text-center text-gray-500 text-sm">
    <p>© 2025 Christopher Falkner</p>
  </footer>
</div>

<script src="js/app.js"></script>
</body>

</html>
